# Serves the CRA build. This is the file the Dockerfile copies to
# /etc/nginx/conf.d/default.conf -- nginx-spa.conf is not used by anything.
server {
    listen 4005;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable: a rebuild produces a new filename, so the old
    # one can be cached for a year without ever going stale.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the entry point.
    #
    # index.html is the only file that names the hashed bundles, and it carried
    # no Cache-Control at all: browsers then fall back to heuristic freshness
    # from Last-Modified and can hold it for hours. A stale index.html pins the
    # browser to the previous bundle, which is itself cached immutably for a
    # year -- so both halves of the old app are present, it keeps working
    # perfectly, and a deploy looks like it did nothing at all.
    #
    # The exact-match location also covers the try_files fallback above, since
    # that is an internal redirect and re-runs location matching.
    # "expires off" stops nginx emitting its own Cache-Control as well, so the
    # response carries one explicit header rather than two that have to be
    # reconciled.
    location = /index.html {
        root /usr/share/nginx/html;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
