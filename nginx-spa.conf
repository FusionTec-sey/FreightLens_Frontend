# Serving the CRA build from nginx needs two things the stock config lacks.
#
# 1. A single-page-app fallback. React Router owns paths like /orders or
#    /admin/menu/5; nginx has no file there and answers 404 on a refresh or a
#    pasted link. try_files hands those paths to index.html so the router can
#    resolve them.
# 2. No caching of index.html. The bundle filename carries a content hash, so a
#    stale index.html pins the browser to an old bundle, which then calls API
#    endpoints that no longer exist.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed assets are immutable: a change produces a new filename.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry point so a new build is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
