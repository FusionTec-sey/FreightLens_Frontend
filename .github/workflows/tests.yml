name: Frontend tests

on:
  pull_request:
  push:
    branches: [main, master, standalone-main, codex/pos-development]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:ci
      - run: npm run build
